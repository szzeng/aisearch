<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>aisearch UI 2.0 · 20万图库视觉参考</title><style>:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#28464b;background:#f2f6f6}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #dde9e5;padding:18px 24px}h1{font-size:23px;margin:0}header p,.meta{color:#789095;font-size:13px}header p{margin:5px 0 0}.wrap{display:grid;grid-template-columns:260px minmax(0,1fr)}nav{background:white;padding:14px;max-height:calc(100vh - 100px);overflow:auto;border-right:1px solid #dae9e6}nav a{display:block;text-decoration:none;color:#41636a;padding:8px 12px;border-radius:9px;font-size:13px}nav a:hover,nav a.current{color:#177b6e;background:#e6f3ee}main{padding:20px;min-width:0}.bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}h2{margin:0;font-size:19px}button{cursor:pointer;background:white;border:1px solid #a7d5c9;color:#247d6f;border-radius:8px;padding:8px 13px}button:focus-visible,a:focus-visible{outline:2px solid #238d7f;outline-offset:2px}.quick{margin:15px 0;display:flex;gap:7px;flex-wrap:wrap}.screen{background:#dbe7e8;border-radius:13px;padding:10px;border:1px solid #d4e0e1}.screen img{width:100%;display:block;max-width:1440px;max-height:calc(100vh - 250px);margin:auto;object-fit:contain}.screen img.narrow{max-width:470px}.meta{margin:10px 0}footer{padding:18px 23px;color:#8b9da2;font-size:12px}@media(max-width:800px){.wrap{display:block}nav{display:flex;max-height:none;overflow:auto}nav a{white-space:nowrap}main{padding:12px}header{padding:14px}}</style></head><body><header><h1>aisearch UI 2.0 · 20万照片库参考页面</h1><p>17 个页面状态 / 可信拍摄日期、入库日期、日期未知、待就绪及搜索分流 · 全部为静态示意，非实际功能截图</p></header><div class="wrap"><nav id="nav"></nav><main><div class="bar"><div><h2 id="heading">页面参考</h2><span class="meta" id="task"></span></div><div><button id="prev">上一页</button> <button id="next">下一页</button></div></div><div class="quick"><button onclick="go(0)">拍摄时间</button><button onclick="go(1)">入库时间</button><button onclick="go(2)">日期未知</button><button onclick="go(3)">日期待就绪</button><button onclick="go(11)">自然语言搜索</button><button onclick="go(12)">入库搜索</button><button onclick="go(13)">日期未知搜索</button></div><div class="screen"><img id="screen" alt="页面视觉效果图"></div><div class="meta">提示：切换按钮仅浏览对应设计稿，不是产品交互。所有数量、人物、照片为构造示例。GitHub 中的矢量参考图与聊天提供的原 PNG 不完全同图。</div></main></div><footer>任务卡与数据合同以 docs/plans/P4-UI-TIMELINE-V2.md 为准。不得将性能目标当成已完成的实测结果。</footer><script>const pages=[{"file":"01-capture-timeline.svg","title":"全部照片 · 拍摄时间轴","task":"CORE / B"},{"file":"02-import-timeline.svg","title":"全部照片 · 入库时间轴","task":"CORE / B"},{"file":"03-unknown-capture.svg","title":"拍摄日期未知","task":"CORE / B"},{"file":"04-capture-pending.svg","title":"拍摄日期待就绪","task":"CORE / B"},{"file":"05-people.svg","title":"人物列表","task":"D"},{"file":"06-person-album.svg","title":"人物相册","task":"D"},{"file":"07-person-collection.svg","title":"人物合集","task":"D"},{"file":"08-organize.svg","title":"人物整理","task":"D"},{"file":"09-places.svg","title":"地点列表","task":"E"},{"file":"10-place-album.svg","title":"地点相册","task":"E"},{"file":"11-map.svg","title":"地图相册","task":"E / SEARCH-MAP"},{"file":"12-natural-search.svg","title":"自然语言搜索","task":"C / SEARCH-MAP"},{"file":"13-import-search.svg","title":"搜索 · 入库时间","task":"SEARCH-MAP"},{"file":"14-unknown-search.svg","title":"搜索 · 没有拍摄日期","task":"SEARCH-MAP"},{"file":"15-viewer.svg","title":"照片查看器","task":"F"},{"file":"16-library.svg","title":"图库管理","task":"A / B"},{"file":"17-narrow.svg","title":"窄屏照片时间轴","task":"A / B"}];const nav=document.getElementById("nav");let current=0;function go(i){current=(i+pages.length)%pages.length;let x=pages[current];document.getElementById("screen").src=x.file;document.getElementById("screen").alt=x.title;document.getElementById("screen").className=current===16?"narrow":"";document.getElementById("heading").textContent=x.title;document.getElementById("task").textContent="对应任务："+x.task;nav.querySelectorAll("a").forEach((a,k)=>a.classList.toggle("current",k===current));history.replaceState(null,"","#"+String(current+1).padStart(2,"0"));}pages.forEach((x,i)=>{const a=document.createElement("a");a.href="#"+String(i+1).padStart(2,"0");a.textContent=String(i+1).padStart(2,"0")+"　"+x.title;a.onclick=e=>{e.preventDefault();go(i)};nav.appendChild(a)});document.getElementById("prev").onclick=()=>go(current-1);document.getElementById("next").onclick=()=>go(current+1);document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(current+1);if(e.key==="ArrowLeft")go(current-1)});go(Math.max(0,Number(location.hash.slice(1)||1)-1));</script></body></html>
