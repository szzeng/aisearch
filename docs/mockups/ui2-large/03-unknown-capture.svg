"751" height="46" rx="23" fill="#edf2f4" stroke="none"/><text x="278" y="80" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="400" fill="#82979d">⌕  搜索照片、人物、地点、时间……</text><text x="1201" y="82" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="400" fill="#889da3">设计示意 · 非实测</text><text x="255" y="154" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="29" font-weight="700" fill="#2b4149">拍摄日期未知</text><text x="255" y="180" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="400" fill="#8a9ea4">已提取，但找不到可信拍摄时间；按入库时间排序</text><rect x="255" y="200" width="1149" height="52" rx="10" fill="#edf8f3" stroke="#d5e8e3"/><text x="274" y="231" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="500" fill="#3f887b">20万＋图库设计    ·   每页约50–60张    ·   查询/年月统计分离    ·   离屏照片有界回收</text><text x="1307" y="232" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" font-weight="400" fill="#9aabae">目标，非测速</text><rect x="255" y="270" width="128" height="34" rx="8" fill="#e6f4ee" stroke="#a9d7c8"/><text x="267" y="292" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#178475">按拍摄时间</text><rect x="394" y="270" width="126" height="34" rx="8" fill="white" stroke="#dce6e8"/><text x="406" y="292" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="500" fill="#536b74">按入库时间</text><rect x="532" y="270" width="92" height="34" rx="8" fill="white" stroke="#dce6e8"/><text x="544" y="292" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="500" fill="#536b74">按日 ▾</text><rect x="635" y="270" width="120" height="34" rx="8" fill="white" stroke="#dce6e8"/><text x="647" y="292" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="500" fill="#536b74">全部年份 ▾</text><rect x="767" y="270" width="146" height="34" rx="8" fill="white" stroke="#dce6e8"/><text x="779" y="292" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="500" fill="#536b74">全部图库 ▾</text><rect x="930" y="270" width="185" height="34" rx="8" fill="white" stroke="#dce6e8"/><text x="942" y="292" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="500" fill="#536b74">返回正常时间轴</text><rect x="255" y="325" width="1011" height="108" rx="13" fill="#fff" stroke="#e0e9e8"/><rect x="273" y="349" width="59" height="59" rx="10" fill="#e4f4f0" stroke="none"/><text x="292" y="389" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="23" font-weight="700" fill="#278f7b">?</text><text x="352" y="359" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="19" font-weight="700" fill="#2f464c">已确认没有可信拍摄日期</text><text x="352" y="387" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="400" fill="#83989c">可能只有文件修改时间或不可信EXIF，不会混进拍摄年份。</text><text x="352" y="413" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="400" fill="#75998f">此列表按入库时间倒序；不提供手动修改或AI猜测日期。</text><text x="255" y="473" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="21" font-weight="700" fill="#2a4149">日期未知照片 · 示例</text><rect x="255" y="491" width="194" height="104" rx="7" fill="#a8a9ce" stroke="none"/><clipPath id="clip255491"><rect x="255" y="491" width="194" height="104" rx="7" fill="white" stroke="none"/></clipPath><g clip-path="url(#clip255491)"><circle cx="402.44" cy="514.92" r="12.48" fill="#fff5d5" opacity=".9"/><path d="M255 558.6Q352 549.24 449 561.72V595H255Z" fill="#298fa9"/><path d="M255 580.44Q348.12 561.72 449 574.2V595H255Z" fill="#ead9ad"/></g><rect x="459" y="491" width="194" height="104" rx="7" fill="#ddc59d" stroke="none"/><clipPath id="clip4594