<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f5f7f9" stroke="none"/><rect x="0" y="0" width="220" height="900" rx="0" fill="#fff" stroke="none"/><rect x="0" y="0" width="1440" height="27" rx="0" fill="#e9f5f0" stroke="none"/><text x="520" y="18" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#5b8781">aisearch UI 2.0 / 20万以上照片库 / 静态设计参考</text><rect x="24" y="53" width="36" height="36" rx="10" fill="#269e8a" stroke="none"/><text x="35" y="78" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="20" font-weight="700" fill="#fff">▧</text><text x="73" y="77" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="22" font-weight="700" fill="#223c43">我的相册</text><rect x="17" y="118" width="185" height="43" rx="9" fill="#fff" stroke="none"/><text x="44" y="146" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="500" fill="#657982">照片</text><rect x="17" y="173" width="185" height="43" rx="9" fill="#fff" stroke="none"/><text x="44" y="201" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="500" fill="#657982">人物</text><rect x="17" y="228" width="185" height="43" rx="9" fill="#fff" stroke="none"/><text x="44" y="256" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="500" fill="#657982">地点</text><rect x="17" y="283" width="185" height="43" rx="9" fill="#e6f4ee" stroke="none"/><text x="44" y="311" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#168373">搜索</text><rect x="17" y="463" width="185" height="43" rx="9" fill="#fff" stroke="none"/><text x="44" y="491" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="500" fill="#657982">图库管理</text><rect x="253" y="51" width="751" height="46" rx="23" fill="#edf2f4" stroke="none"/><text x="278" y="80" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="400" fill="#82979d">⌕  搜索照片、人物、地点、时间……</text><text x="1201" y="82" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="400" fill="#889da3">设计示意 · 非实测</text><text x="255" y="152" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#2b4149">日期未知搜索</text><text x="255" y="179" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="400" fill="#87999f">先解析人物、地点和时间，再决定是否需要内容检索。</text><rect x="255" y="205" width="1015" height="60" rx="12" fill="white" stroke="#e1e8e9"/><text x="280" y="242" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17" font-weight="400" fill="#3c5860">⌕  没有拍摄日期的照片</text><rect x="1142" y="217" width="110" height="34" rx="8" fill="#e6f4ee" stroke="#a9d7c8"/><text x="1154" y="239" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#178475">搜索</text><rect x="255" y="284" width="175" height="34" rx="8" fill="#e6f4ee" stroke="#a9d7c8"/><text x="267" y="306" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#178475">条件：全部照片</text><rect x="441" y="284" width="拍摄日期：未知 ×" height="34" rx="8" fill="white" stroke="#dce6e8"/><text x="453" y="306" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="500" fill="#536b74">true</text><rect x="255" y="337" width="1010" height="74" rx="12" fill="#edf7f2" stroke="#d0e4db"/><text x="276" y="364" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="600" fill="#317b6e">检索路径：纯条件，直接使用 SQLite 完整分页，无需启动 AI 编码器。</text><text x="276" y="391" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="400" fill="#799b93">按时间排序可完整分页；不从已加载的照片推算全部年月数量。</text><text x="255" y="462" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="21" font-weight="700" fill="#2b4247">拍摄日期未知 · 按入库时间倒序</text><rect x="1037" y="432" width="228" height="34" rx="8" fill="white" stroke="#dce6e8"/><text x="1049" y="454" font-family="Arial,'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="500" fill="#536b74">按时间查看 ▾</text><rect x="255" y="482" width="194" height="104" rx="7" fill="#accddb" stroke="none"/><clipPath id="clip255482"><rect x="255" y="482" width="194" height="104" rx="7" fill="white" stroke="none"/></clipPath><g clip-path="url(#clip255482)"><circle cx="402.44" cy="505.92" r="12.48" fill="#fff5d5" opacity=".9"/><path d="M255 563.12L297.68 511.12L338.42 561.04L384.98 500.72L449 554.8V586H255Z" fill="#648b8a"/><path d="M255 575.6Q348.12 546.48 449 564.16V586H255Z" fill="#4c9e84"/></g><rect x="459" y="482" width="194" height="104" rx="7" fill="#f2c092" stroke="none"/><clipPath id="clip459482"><rect x="459" y="482" width="194" height="104" rx="7" fill="white" stroke="none"/></clipPath><g clip-path="url(#clip459482)"><circle cx="606.44" cy="505.92" r="12.48" fill="#fff5d5" opacity=".9"/><path d="M459 571.44V542.3199999999999h23.279999999999998v-18.72h27.160000000000004v22.88h19.400000000000002v-43.68h27.160000000000004v34.32h25.220000000000002v-19.76h25.220000000000002v45.76h27.160000000000004v-31.2h19.400000000000002V586H459Z" fill="#547282"/></g><rect x="663" y="482" width="194" height="104" rx="7" fill="#90bed2" stroke="none"/><clipPath id="clip663482"><rect x="663" y="482" width="194" height="104" rx="7" fill="white" stroke="none"/></clipPath><g clip-path="url(#clip663482)"><circle cx="810.44" cy="505.92" r="12.48" fill="#fff5d5" opacity=".9"/><path d="M663 549.6Q760 540.24 857 552.72V586H663Z" fill="#298fa9"/><path d="M663 571.44Q756.12 552.72 857 565.2V586H663Z" fill="#ead9ad"/></g><rect x="867" y="482" width="194" height="104" rx="7" fi