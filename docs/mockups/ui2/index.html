<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>aisearch · UI 2.0 参考页面</title><style>:root{color-scheme:light;--a:#228575}*{box-sizing:border-box}body{margin:0;background:#f2f5f6;color:#273b43;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{background:white;border-bottom:1px solid #dee9ea;padding:20px 28px}h1{margin:0;font-size:25px}header p{color:#738b90;margin:5px 0 0}.app{display:grid;grid-template-columns:255px minmax(0,1fr);min-height:calc(100vh - 101px)}aside{background:white;padding:15px;border-right:1px solid #dde7e8}a{color:inherit;text-decoration:none}.link{display:block;padding:10px 12px;margin:3px 0;border-radius:9px;cursor:pointer}.link:hover,.link.active{background:#e8f5f0;color:#168171}main{min-width:0;padding:24px}.title{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}h2{font-size:21px;margin:0}.frame{background:#e4edf0;border:1px solid #d8e3e6;border-radius:15px;overflow:hidden;padding:10px}#preview{display:block;width:100%;max-width:1440px;margin:auto;height:auto;box-shadow:0 8px 35px #18343811;border-radius:8px}#preview.narrow{max-width:470px}button{border:1px solid #bdd9d3;border-radius:8px;padding:8px 14px;background:white;color:#177d70;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #228575;outline-offset:2px}.note{font-size:13px;color:#71858b;margin-top:15px}footer{color:#82949b;font-size:12px;padding:12px 25px}@media(max-width:780px){.app{display:block}aside{display:flex;flex-wrap:wrap;gap:4px;padding:9px}aside .link{font-size:13px;margin:0;padding:7px 8px}main{padding:12px}header{padding:14px}h1{font-size:20px}}</style></head><body><header><h1>aisearch · UI 2.0 全页面视觉参考</h1><p>统一时间轴 + 人物 / 地点 / 搜索 / 管理 · 离线静态设计稿，未接入真实照片或业务接口</p></header><div class="app"><aside id="nav"></aside><main><div class="title"><div><h2 id="title"></h2><span class="note" id="subtitle"></span></div><div><button id="prev">上一页</button> <button id="next">下一页</button></div></div><div class="frame"><img id="preview" alt="当前页面效果图"></div><p class="note">静态 SVG 设计参考。此处的按钮、图库数量与照片仅为视觉示例，不代表已实施的功能；各页面展示请以对应任务卡与 UI 2.0 规范为准。</p></main></div><footer>键盘 ← → 可切换。页面可独立打开 SVG。适配窄屏查看。</footer><script>const pages=[{"file":"01-photos.svg","title":"照片时间轴（全部照片）","sub":"拍摄 / 入库时间 · 日月年分组 · 年月快速跳转"},{"file":"02-people.svg","title":"人物列表与整理入口","sub":"头像、姓名与照片数优先，整理入口分离"},{"file":"03-person-album.svg","title":"人物相册","sub":"按当前人物有效照片构建时间轴"},{"file":"04-collection.svg","title":"人物合集","sub":"多个成员的照片去重后统一按时间展示"},{"file":"05-organize.svg","title":"人物整理","sub":"疑似人物头像与待确认人脸并排比对"},{"file":"06-places.svg","title":"地点列表","sub":"城市、省份和国家相册按需浏览"},{"file":"07-place-album.svg","title":"地点相册","sub":"地点有效照片按拍摄时间分组"},{"file":"08-map.svg","title":"地图相册","sub":"范围照片与地图聚合保留原语义"},{"file":"09-search.svg","title":"自然语言搜索","sub":"相关度结果优先，纯条件可切时间模式"},{"file":"10-viewer.svg","title":"照片查看器","sub":"查看详情、同日跳转并返回原浏览位置"},{"file":"11-management.svg","title":"图库管理","sub":"来源、扫描建库、刷新及维护工具"},{"file":"12-narrow.svg","title":"窄屏照片时间轴","sub":"日期分组与时间跳转在窄屏也可使用"}];const nav=document.getElementById("nav"),img=document.getElementById("preview"),h=document.getElementById("title"),sub=document.getElementById("subtitle");let idx=0;function go(i){idx=(i+pages.length)%pages.length;const p=pages[idx];img.src=p.file;img.className=idx===11?"narrow":"";img.alt=p.title;h.textContent=p.title;sub.textContent=p.sub;nav.querySelectorAll("a").forEach((a,j)=>a.classList.toggle("active",j===idx));location.hash=String(idx+1).padStart(2,"0");}pages.forEach((p,i)=>{let a=document.createElement("a");a.href="#"+String(i+1).padStart(2,"0");a.className="link";a.textContent=String(i+1).padStart(2,"0")+"  "+p.title;a.onclick=e=>{e.preventDefault();go(i)};nav.append(a)});document.getElementById("prev").onclick=()=>go(idx-1);document.getElementById("next").onclick=()=>go(idx+1);window.addEventListener("keydown",e=>{if(e.target.closest("input,textarea"))return;if(e.key==="ArrowLeft")go(idx-1);if(e.key==="ArrowRight")go(idx+1)});go(Math.max(0,(parseInt(location.hash.slice(1),10)||1)-1));</script></body></html>
