[project]
name = "photo-search"
version = "0.1.0"
description = "Personal local photo search system"
readme = "README.md"
requires-python = "==3.12.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
photo-search = "photo_search.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]