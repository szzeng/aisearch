[project]
name = "photo-search"
version = "0.1.0"
description = "Personal local photo search system"
readme = "README.md"
requires-python = "==3.12.10"
dependencies = [
    "fastapi>=0.115,<1",
    "insightface>=2.0,<3",
    "lancedb>=0.38.0",
    "onnx>=1.17,<2",
    "onnxruntime-gpu[cuda,cudnn]>=1.30,<2; sys_platform != 'darwin'",
    "onnxruntime>=1.30,<2; sys_platform == 'darwin'",
    "pillow>=10,<12",
    "pillow-heif==1.8.0",
    "pydantic>=2.9,<3",
    "rapidocr==3.9.2",
    "scipy>=1.15,<2",
    "shapely>=2.1,<3",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "sentencepiece>=0.2,<1",
    "transformers>=4.57,<5",
    "uvicorn>=0.30,<1",
]

[project.scripts]
photo-search = "photo_search.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "psutil>=7,<8",
    "pyinstaller>=6.11,<7",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

geo-data = ["rdata>=1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_search"]

[tool.hatch.build.targets.wheel.force-include]
"src/photo_search/web/dist" = "photo_search/web/dist"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --junitxml=test-results/junit.xml --basetemp=.pytest-tmp/tests"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
