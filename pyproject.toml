[project]
name = "photo-search"
version = "0.1.0"
description = "Personal local photo search system"
readme = "README.md"
requires-python = "==3.12.10"
dependencies = [
    "fastapi>=0.115,<1",
    "insightface>=2.0,<3",
    "lancedb[pylance]>=0.38.0",
    "onnx>=1.17,<2",
    "onnxruntime-gpu[cuda,cudnn]>=1.30,<2",
    "pillow>=10,<12",
    "pillow-heif==1.8.0",
    "pydantic>=2.9,<3",
    "qwen-vl-utils==0.0.14",
    "rapidocr-onnxruntime>=1.4.4,<1.5",
    "shapely==2.1.2",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.57.0",
    "uvicorn>=0.30,<1",
]

[project.scripts]
photo-search = "photo_search.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pyinstaller>=6.11,<7",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]
places-build = [
    "osmium==4.3.1",
    "shapely==2.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_search"]

# The product ships a single ONNX Runtime distribution: onnxruntime-gpu provides the
# CUDA, Azure and CPU execution providers plus the `onnxruntime` Python module.
# `rapidocr-onnxruntime` still declares `onnxruntime>=1.7.0`; the override below drops
# that CPU-only distribution so no second copy of the same module can overwrite it.
[tool.uv]
override-dependencies = ["onnxruntime; sys_platform == 'never'"]

# P4-Embedding-Arch: the single environment carries both semantic providers, and the PyTorch
# half is the CUDA 12.8 build the Qwen3-VL-Embedding-2B measurements were taken with. The
# indicator is explicit so a CPU-only `torch` wheel can never be resolved by accident: the
# Qwen adapter reports ``EMBEDDING_DEVICE_UNAVAILABLE`` instead of silently running on a host
# device it was not qualified on.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --junitxml=test-results/junit.xml --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
